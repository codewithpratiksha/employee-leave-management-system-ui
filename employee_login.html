<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/employeelogin.css">
</head>
<body>
    <div class="container">
    <h1 class="project-title">Employee Leave Management System</h1>
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-10">
            <div class="login-card">
                <div class="text-center text-muted emplogin mb-4">
                    <p>Employee Login</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" name="emplynuname" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="emplypass" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Login</button>

                    <div class="text-center mt-3">
                        <p class="mb-1"> New Employee?</p>
                        <a href="employee_register.html">Register Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>

</body>
</html>
