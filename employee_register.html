<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/employeeregister.css">
</head>
<body>
    <div class="container">
        <h1 class="project-title">Employee Leave Management System</h1>
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-10">
                <div class="register-card">
                    <div class="text-center">
                        <h2 class="text-muted fw-bold pb-3">Employee Registration</h2>
                    </div>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Register</button>
                        <div class="text-center mt-3">
                            <p class="mb-1">Already registered?</p>
                            <a href="employee_login.html">Login Here</a>
                        </div>
                    
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
